# travail du dépôt : ils n'ont rien à faire sur le domaine (CLAUDE.md était
# lisible à https://cv.antoine.berthaud.me/CLAUDE.md). Les pages, css/, js/
# et assets/ restent servis normalement.
exclude:
  - CLAUDE.md
  - README.md
  - package.json
  - package-lock.json
  - scripts/
  - supabase/
  - .github/
