name: Générer les PDF du CV

# Se déclenche uniquement quand le contenu/style du CV change (pas sur le
# README ou d'autres fichiers sans rapport). [À COMPLÉTER] si ta branche
# principale s'appelle "master" plutôt que "main", change-le ci-dessous.
"on":
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/photo/**"
      - "scripts/generate-pdf.js"
      - "package.json"
  workflow_dispatch: {} # permet aussi de le relancer manuellement depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour que le workflow puisse recommitter les PDF générés

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances npm
        run: npm install

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Générer les PDF FR et EN
        run: npm run generate-pdf

      - name: Committer les PDF s'ils ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cv-antoine-berthaud-fr.pdf assets/cv-antoine-berthaud-en.pdf
          if git diff --cached --quiet; then
            echo "Aucun changement dans les PDF, rien à committer."
          else
            git commit -m "chore: régénère les PDF du CV [skip ci]"
            git push
          fi
