name: Vérifier la PR

# Rejoue sur chaque pull request les étapes de generate-pdf.yml SANS commit :
# syntaxe des JS, pré-rendu des trois pages avec ses garde-fous (erreur JS,
# zone vide, marqueur manquant, page trop courte, mots attendus absents),
# génération des deux PDF avec les leurs (erreur JS, page sans expérience,
# polices absentes, liens locaux, PDF trop court). Rien n'empêchait jusqu'ici
# de merger une page cassée.
#
# Tourne sur TOUTES les PR, sans filtre de chemins : un check exigé par un
# ruleset qui ne se déclenche pas (PR sur le README seul) laisse la PR
# bloquée sur « Expected — Waiting for status to be reported ». Trois minutes
# par PR, c'est le prix d'un garde-fou fiable.
"on":
  pull_request:
    branches: [main]

# Une nouvelle poussée sur la même PR annule le run précédent.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci + package-lock.json : les mêmes versions à chaque run. Avec
      # npm install sans lockfile, Chromium (via Playwright) changeait tout
      # seul et la pagination des PDF avec, sans que personne ne regarde.
      - name: Installer les dépendances npm
        run: npm ci --ignore-scripts # aucun script d'installation ne tourne à côté du jeton du dépôt

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Vérifier la syntaxe des fichiers JS
        run: node --check js/data.js && node --check js/app.js && node --check js/i18n.js && node --check js/gemini.js && node --check js/project-detail.js && node --check js/results.js

      - name: Pré-rendre les pages (sans les committer)
        run: npm run generate-static

      - name: Générer les PDF FR et EN (sans les committer)
        run: npm run generate-pdf
