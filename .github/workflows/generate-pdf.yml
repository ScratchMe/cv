name: Générer les PDF du CV

# Se déclenche quand le contenu/style du CV change (pas sur le README ou
# d'autres fichiers sans rapport), ET une fois par mois indépendamment de
# tout changement de code : les durées d'expérience affichées sur le CV
# (calculées depuis js/data.js jusqu'à "aujourd'hui") avancent avec le
# calendrier, donc les PDF doivent être régénérés régulièrement pour rester
# à jour même quand rien d'autre n'a changé.
# Les mêmes étapes tournent sur chaque PR, sans commit : voir pr-checks.yml.
"on":
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/photo/**"
      - "assets/logos/**"
      - "scripts/generate-pdf.js"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 4 1 * *" # le 1er de chaque mois à 4h UTC, pour rafraîchir les durées affichées
  workflow_dispatch: {} # permet aussi de le relancer manuellement depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour que le workflow puisse recommitter les PDF générés
  issues: write # nécessaire pour ouvrir une issue si la génération échoue (surveillance)

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci + package-lock.json : les mêmes versions à chaque run. Avec
      # npm install sans lockfile, Chromium (via Playwright) changeait tout
      # seul et la pagination des PDF avec, sans que personne ne regarde.
      - name: Installer les dépendances npm
        run: npm ci --ignore-scripts # aucun script d'installation ne tourne à côté du jeton du dépôt

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      # Sans pipe : un `| head` masquerait le code de sortie. Un data.js cassé
      # est repéré ici, avant de produire un PDF vide.
      - name: Vérifier la syntaxe des fichiers JS
        run: node --check js/data.js && node --check js/app.js && node --check js/i18n.js && node --check js/gemini.js && node --check js/project-detail.js && node --check js/results.js

      - name: Générer les PDF FR et EN
        run: npm run generate-pdf

      - name: Committer les PDF s'ils ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cv-antoine-berthaud-fr.pdf assets/cv-antoine-berthaud-en.pdf
          if git diff --cached --quiet; then
            echo "Aucun changement dans les PDF, rien à committer."
          else
            # Les deux PDF sont déclarés dans sitemap.xml : on y reporte la date
            # de régénération (UTC) pour que leur <lastmod> reste vrai.
            python3 - "$(date -u +%Y-%m-%d)" <<'EOF'
          import re, sys, pathlib
          p = pathlib.Path("sitemap.xml")
          s, n = re.subn(r"(<loc>[^<]*\.pdf</loc>\s*<lastmod>)\d{4}-\d{2}-\d{2}", r"\g<1>" + sys.argv[1], p.read_text())
          p.write_text(s)
          print(f"sitemap.xml : {n} lastmod de PDF mis à jour au {sys.argv[1]}")
          EOF
            git add sitemap.xml
            git commit -m "chore: régénère les PDF du CV [skip ci]"
            git push
          fi

      # Surveillance : si une étape précédente a échoué, on ouvre (ou on
      # réutilise) une issue plutôt que de laisser l'échec passer inaperçu
      # dans l'onglet Actions. Évite les doublons si l'échec se répète.
      - name: Signaler l'échec via une issue
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "⚠️ Échec de la génération des PDF du CV";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Le workflow **Générer les PDF du CV** a échoué (déclenché par \`${context.eventName}\`).`,
              "",
              `Voir les logs : ${runUrl}`,
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pdf-generation-failure",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Nouvel échec : ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["pdf-generation-failure"],
              });
            }
