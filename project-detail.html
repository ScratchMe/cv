<!-- Analytics respectueux de la vie privée (GoatCounter) — pas de cookies,
     pas de données personnelles. Le chemin compté est figé ICI, avant le
     chargement de count.js (async) : on ne garde que ?slug= et ?lang=en,
     jamais ref/utm ni le fragment, pour que /?lang=en remonte toujours pareil
     quelle que soit la vitesse du réseau. Compte configuré (site
     "antoineberthaud"), tableau de bord : https://antoineberthaud.goatcounter.com
     — voir README §8 (événements, exclure ses propres visites). -->
<script>
  window.goatcounter = { path: (function () {
    var q = new URLSearchParams(location.search), keep = [];
    if (q.get("slug")) keep.push("slug=" + encodeURIComponent(q.get("slug")));
    if (q.get("lang") === "en") keep.push("lang=en");
    return location.pathname + (keep.length ? "?" + keep.join("&") : "");
  })() };
</script>
<script data-goatcounter="https://antoineberthaud.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
