<!-- ANCIENNE ADRESSE des études de cas de side projects (project-detail.html
     ?slug=…, jusqu'en septembre 2026). Chaque projet a désormais sa page
     statique : /projets/<slug>.html et /en/projects/<slug>.html. Le script
     ci-dessous, en tête du <head>, y redirige les slugs connus (en anglais si
     l'ancien paramètre lang vaut en) ; la liste des slugs est une zone
     générée par scripts/generate-static.js. Slug inconnu ou absent : la page
     reste, js/project-detail.js y affiche « Projet introuvable » et pose un
     noindex. Volontairement ni canonical, ni noindex dans ce HTML (Google doit
     pouvoir suivre la redirection), ni GoatCounter (la visite est comptée sur
     la page d'arrivée). -->
<!-- static:projectRedirect -->
<script id="project-redirect">
  (function () {
    var pages = {"tour-de-growth":{"fr":"/projets/tour-de-growth.html","en":"/en/projects/tour-de-growth.html"}};
    var q = new URLSearchParams(location.search), slug = q.get("slug");
    if (slug && Object.prototype.hasOwnProperty.call(pages, slug)) {
      location.replace(pages[slug][q.get("lang") === "en" ? "en" : "fr"] + location.hash);
    }
  })();
</script>
<!-- /static:projectRedirect -->
